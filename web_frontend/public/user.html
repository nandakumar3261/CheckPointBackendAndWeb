<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guard — Aditya Security Guard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" style="width:34px;height:34px;font-size:15px;">AS</div>
      <span>GUARD PANEL</span>
    </div>

    <div class="nav-group-label">Duty</div>
    <div class="nav-link active" data-section="home">Home</div>

    </div>

        <button class="menu-toggle" id="menuToggle">☰</button>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Aditya Security Guard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" style="width:34px;height:34px;font-size:15px;">AS</div>
      <span>ADMIN PANEL</span>
    </div>

    <div class="nav-group-label">Operations</div>
    <div class="nav-link active" data-section="home">Home</div>
    <div class="nav-link" data-section="scanQr">Scan QR Code</div>
    <div class="nav-link" data-section="getQrData">Get QR Code Data</div>
    <div class="nav-link" data-section="uploadImages">Upload Images</div>
    <div class="nav-link" data-section="getUploadedImages">Get Uploaded Images</div>

    <div class="nav-group-label">Workforce</div>
    <div class="nav-link" data-section="addSecurity">Add Security</div>
    <div class="nav-link" data-section="getSecurityData">Get Security Data</div>
    <div class="nav-link" data-section="addDutyPlaces">Add Duty Places</div>
    <div class="nav-link" data-section="assignDuty">Assign Duty to Guard</div>
    <div class="nav-link" data-section="showAssignedDuties">Show Assigned Duties</div>
    <div class="nav-link" data-section="deleteAssignDuty">Delete Assign Duty</div>
    <div class="nav-link" data-section="dutyFinishedStatus">Duty Finished Status</div>

    <div class="nav-group-label">Account</div>
    <div class="nav-link" data-section="profile">Update Profile Pic</div>
    <div class="nav-link" data-section="contact">Contact Us</div>

    <div class="sidebar-footer">
      <div class="nav-link" id="logoutBtn" style="color:#e2574c;">Logout</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="pageTitle">Home</h1>
      </div>
      <div class="who">
        <span id="whoName"></span>
        <div class="avatar" id="avatarInitial"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/csv.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
